name: CI Pipeline

on:
  push:
    branches: [main, 'feature/**', 'bolt/**']
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'specs/006-rechazo-solicitudes/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'specs/006-rechazo-solicitudes/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  backend:
    name: Backend gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore packages and local tools
        run: |
          dotnet restore VacationManagement.sln
          dotnet tool restore
      - name: Build with warnings as errors
        run: dotnet build VacationManagement.sln --no-restore
      - name: Format and analyzers
        run: dotnet format VacationManagement.sln --no-restore --verify-no-changes
      - name: Unit tests and coverage
        run: dotnet test tests/VacationManagement.UnitTests --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults/unit
      - name: Require unit line coverage of at least 80 percent
        shell: pwsh
        run: |
          & ../../.github/scripts/Test-BackendCoverage.ps1
          & ../../.github/scripts/Assert-BackendCoverage.ps1 -ResultsDirectory TestResults/unit
      - name: Architecture tests
        run: dotnet test tests/VacationManagement.ArchitectureTests --no-build --no-restore
      - name: API integration tests
        run: dotnet test tests/VacationManagement.IntegrationTests --no-build --no-restore
      - name: Require mutation score of at least 60 percent
        run: dotnet tool run dotnet-stryker --output TestResults/mutation
      - name: Upload backend evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: src/backend/TestResults/
          if-no-files-found: warn

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Workflow regression checks
        run: node --test ../../.github/scripts/application-ci.test.cjs
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests with mandatory coverage thresholds
        run: npm run test:coverage
      - name: Require mutation score of at least 60 percent
        run: npm run test:mutation
      - name: Upload frontend evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence
          path: |
            src/frontend/coverage/
            src/frontend/reports/mutation/
          if-no-files-found: warn

  e2e:
    name: Local fullstack E2E
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload E2E evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          if-no-files-found: warn

  ci-summary:
    name: CI Summary
    needs: [backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every application gate
        shell: pwsh
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          $results = $env:JOB_RESULTS | ConvertFrom-Json
          foreach ($job in $results.PSObject.Properties) {
            if ($job.Value.result -ne 'success') {
              throw "Application gate $($job.Name): $($job.Value.result)"
            }
          }
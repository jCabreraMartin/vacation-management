name: DevOps Documentation Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: DevOps documentation governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate read-only governance implementation
        run: node --test .github/scripts/legacy-checks.test.cjs
      - name: Check published project evidence and local links
        run: node .github/scripts/legacy-checks.cjs documentation
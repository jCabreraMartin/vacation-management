name: Contract Tests

on:
  push:
    paths:
      - 'contracts/**'
      - 'src/**'
      - 'specs/006-rechazo-solicitudes/**'
      - 'docs/design/architecture/**'
      - '.github/scripts/legacy-checks*'
      - '.github/workflows/contract-tests.yml'
      - '.github/workflows/devops-doc-sync.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'src/**'
      - 'specs/006-rechazo-solicitudes/**'
      - 'docs/design/architecture/**'
      - '.github/scripts/legacy-checks*'
      - '.github/workflows/contract-tests.yml'
      - '.github/workflows/devops-doc-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traceability:
    name: Contract traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate check implementations
        run: node --test .github/scripts/legacy-checks.test.cjs
      - name: Check AC, Gherkin tags and documented API routes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/legacy-checks.cjs contracts

  api:
    name: Existing API behavior tests
    needs: traceability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify the existing endpoint contract
        run: dotnet test tests/VacationManagement.IntegrationTests --filter FullyQualifiedName~VacationRequestEndpointsTests --logger trx --results-directory TestResults/contracts
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: api-contract-evidence
          path: src/backend/TestResults/contracts/
          if-no-files-found: warn

  summary:
    name: Contract Checks Summary
    needs: [traceability, api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable contract checks
        env:
          TRACEABILITY_RESULT: ${{ needs.traceability.result }}
          API_RESULT: ${{ needs.api.result }}
        run: |
          test "$TRACEABILITY_RESULT" = success
          test "$API_RESULT" = success